name: Build LÖVE 11.5 LoveGame APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build signed LÖVE 11.5 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Clone official LÖVE Android 11.5a
        run: |
          set -e
          rm -rf android
          git clone \
            --depth 1 \
            --branch 11.5a \
            --recurse-submodules \
            --shallow-submodules \
            https://github.com/love2d/love-android.git \
            android
          cd android
          git submodule sync --recursive
          git submodule update --init --force --recursive

      - name: Install custom LÖVE 11.5 source
        run: |
          set -e
          test -d src || { echo "ERRO: pasta src não encontrada."; exit 1; }

          rm -rf android/love/src/common
          rm -rf android/love/src/modules
          rm -rf android/love/src/libraries
          rm -f android/love/src/love.cpp
          rm -f android/love/src/love.h

          cp -a src/. android/love/src/

          [ ! -f changes.txt ] || cp changes.txt android/love/
          [ ! -f license.txt ] || cp license.txt android/love/
          [ ! -f readme.md ] || cp readme.md android/love/README.md

      - name: Validate Python patch
        run: |
          set -e
          python3 -m py_compile scripts/patch-lovegame-launcher.py

      - name: Apply LoveGame launcher patch
        run: |
          set -e
          python3 scripts/patch-lovegame-launcher.py

      - name: Verify patched launcher
        run: |
          set -e
          FILE="android/love/src/main/java/org/love2d/android/GameActivity.java"
          test -f "$FILE"
          grep -q "LOVEGAME_MAX_DEPTH" "$FILE"
          grep -q "ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION" "$FILE"
          grep -q "Environment.isExternalStorageManager" "$FILE"
          grep -q "findLovegameFolders" "$FILE"
          grep -q "MANAGE_EXTERNAL_STORAGE" android/love/src/main/AndroidManifest.xml
          echo "Launcher patch verified."

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmake;3.22.1" \
            "ndk;25.2.9519653"

      - name: Build unsigned Release APK
        working-directory: android
        run: |
          set -e
          chmod +x gradlew
          ./gradlew clean assembleNormalRecordRelease --no-daemon --stacktrace

      - name: Locate unsigned APK
        id: apk
        run: |
          set -e
          APK="$(find android/app/build/outputs/apk -type f -name '*release-unsigned.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "ERRO: APK unsigned não encontrado."
            find android/app/build/outputs/apk -type f -print || true
            exit 1
          fi
          echo "APK=$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Create temporary signing key
        env:
          KEYSTORE_PASSWORD: lovegame_android_2026
        run: |
          set -e
          mkdir -p signing
          keytool -genkeypair -v \
            -keystore signing/lovegame-release.jks \
            -storetype JKS \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            -alias lovegame \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=LoveGame Android, OU=LoveGame, O=LoveGame, L=Brazil, ST=SP, C=BR"

      - name: Zipalign APK
        env:
          UNSIGNED_APK: ${{ steps.apk.outputs.path }}
        run: |
          set -e
          ZIPALIGN="$ANDROID_HOME/build-tools/34.0.0/zipalign"
          "$ZIPALIGN" -p -f 4 "$UNSIGNED_APK" lovegame-aligned.apk

      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: lovegame_android_2026
        run: |
          set -e
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          "$APKSIGNER" sign \
            --ks signing/lovegame-release.jks \
            --ks-key-alias lovegame \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --key-pass pass:"$KEYSTORE_PASSWORD" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out lovegame-android-release.apk \
            lovegame-aligned.apk

      - name: Verify signed APK
        run: |
          set -e
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose lovegame-android-release.apk
          test -s lovegame-android-release.apk
          ls -lh lovegame-android-release.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: lovegame-android-release
          path: lovegame-android-release.apk
          if-no-files-found: error
          retention-days: 30
