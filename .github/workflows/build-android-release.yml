name: Build LÖVE 11.5 LoveGame APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build signed LÖVE 11.5 APK
    runs-on: ubuntu-latest

    steps:

      # ---------------------------------------------------------
      # 1. Baixar o repositório
      # ---------------------------------------------------------
      - name: Checkout lovegame-android
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Java 17
      # ---------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ---------------------------------------------------------
      # 3. Android SDK
      # ---------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ---------------------------------------------------------
      # 4. Dependências Android
      # ---------------------------------------------------------
      - name: Install Android dependencies
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "cmake;3.22.1" \
            "ndk;26.1.10909125"

      # ---------------------------------------------------------
      # 5. Baixar LÖVE Android 11.5a oficial
      # ---------------------------------------------------------
      - name: Clone LÖVE Android 11.5a
        run: |
          rm -rf android

          git clone \
            --depth 1 \
            --branch 11.5a \
            --recurse-submodules \
            --shallow-submodules \
            https://github.com/love2d/love-android.git \
            android

      # ---------------------------------------------------------
      # 6. Garantir submodules
      # ---------------------------------------------------------
      - name: Update LÖVE submodules
        working-directory: android
        run: |
          git submodule sync --recursive
          git submodule update --init --force --recursive

      # ---------------------------------------------------------
      # 7. Substituir o código LÖVE pelo código do projeto
      # ---------------------------------------------------------
      - name: Install custom LÖVE source
        run: |
          set -e

          if [ ! -d "src" ]; then
            echo "ERRO: pasta src não encontrada na raiz do repositório."
            exit 1
          fi

          echo "Removendo código LÖVE anterior..."

          rm -rf android/love/src/common
          rm -rf android/love/src/modules
          rm -rf android/love/src/libraries
          rm -f android/love/src/love.cpp
          rm -f android/love/src/love.h

          echo "Copiando código LÖVE personalizado..."

          cp -a src/. android/love/src/

          if [ -f "changes.txt" ]; then
            cp changes.txt android/love/
          fi

          if [ -f "license.txt" ]; then
            cp license.txt android/love/
          fi

          if [ -f "README.md" ]; then
            cp README.md android/love/
          fi

      # ---------------------------------------------------------
      # 8. Aplicar patch do lovegame
      # ---------------------------------------------------------
      - name: Patch GameActivity
        run: |
          set -e

          if [ -f "scripts/patch-lovegame-launcher.py" ]; then
            python3 scripts/patch-lovegame-launcher.py
          else
            echo "ERRO: scripts/patch-lovegame-launcher.py não encontrado."
            exit 1
          fi

      # ---------------------------------------------------------
      # 9. Verificar GameActivity
      # ---------------------------------------------------------
      - name: Verify GameActivity
        run: |
          set -e

          FILE="android/love/src/main/java/org/love2d/android/GameActivity.java"

          if [ ! -f "$FILE" ]; then
            echo "ERRO: GameActivity.java não encontrado."
            exit 1
          fi

          echo "GameActivity encontrado:"
          echo "$FILE"

          grep -q "lovegame" "$FILE" || {
            echo "ERRO: patch lovegame não encontrado em GameActivity.java."
            exit 1
          }

      # ---------------------------------------------------------
      # 10. Manifest
      # ---------------------------------------------------------
      - name: Configure storage permission
        run: |
          set -e

          MANIFEST="android/love/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERRO: AndroidManifest.xml não encontrado."
            exit 1
          fi

          if ! grep -q "MANAGE_EXTERNAL_STORAGE" "$MANIFEST"; then

            python3 - <<'PY'
from pathlib import Path

p = Path("android/love/src/main/AndroidManifest.xml")
text = p.read_text()

permission = '<uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />'

if permission not in text:
    marker = "<application"

    if marker in text:
        text = text.replace(
            marker,
            permission + "\n\n    " + marker,
            1
        )
    else:
        raise SystemExit(
            "Não foi possível localizar <application no Manifest."
        )

    p.write_text(text)
PY

          fi

          echo "Manifest configurado."

      # ---------------------------------------------------------
      # 11. Gradle
      # ---------------------------------------------------------
      - name: Make Gradle executable
        working-directory: android
        run: chmod +x gradlew

      # ---------------------------------------------------------
      # 12. Limpar build anterior
      # ---------------------------------------------------------
      - name: Gradle clean
        working-directory: android
        run: |
          ./gradlew clean --no-daemon

      # ---------------------------------------------------------
      # 13. Compilar LÖVE 11.5 normalRecord Release
      # ---------------------------------------------------------
      - name: Build LÖVE 11.5
        working-directory: android
        run: |
          ./gradlew assembleNormalRecordRelease \
            --no-daemon \
            --stacktrace

      # ---------------------------------------------------------
      # 14. Encontrar APK unsigned
      # ---------------------------------------------------------
      - name: Locate unsigned APK
        id: locate_apk
        run: |
          set -e

          APK=$(find android/app/build/outputs/apk \
            -type f \
            -name "*normal-record-release-unsigned.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: APK unsigned não encontrado."

            echo "Arquivos encontrados:"
            find android/app/build/outputs/apk -type f || true

            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK"

          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------
      # 15. Criar keystore temporário
      # ---------------------------------------------------------
      - name: Create signing keystore
        env:
          KEYSTORE_PASSWORD: lovegame_android_2026
        run: |
          set -e

          mkdir -p signing

          keytool \
            -genkeypair \
            -v \
            -keystore signing/lovegame-release.jks \
            -storetype JKS \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            -alias lovegame \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=LoveGame Android, OU=LoveGame, O=LoveGame, L=Brazil, ST=SP, C=BR"

      # ---------------------------------------------------------
      # 16. Zipalign
      # ---------------------------------------------------------
      - name: Zipalign APK
        env:
          UNSIGNED_APK: ${{ steps.locate_apk.outputs.apk }}
        run: |
          set -e

          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"

          if [ ! -f "$BUILD_TOOLS/zipalign" ]; then
            echo "ERRO: zipalign não encontrado."
            exit 1
          fi

          "$BUILD_TOOLS/zipalign" \
            -p \
            -f \
            4 \
            "$UNSIGNED_APK" \
            lovegame-aligned.apk

      # ---------------------------------------------------------
      # 17. Assinar APK
      # ---------------------------------------------------------
      - name: Sign APK
        env:
          KEYSTORE_PASSWORD: lovegame_android_2026
        run: |
          set -e

          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"

          "$BUILD_TOOLS/apksigner" sign \
            --ks signing/lovegame-release.jks \
            --ks-key-alias lovegame \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --key-pass pass:"$KEYSTORE_PASSWORD" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out lovegame-android-release.apk \
            lovegame-aligned.apk

      # ---------------------------------------------------------
      # 18. Verificar assinatura
      # ---------------------------------------------------------
      - name: Verify signed APK
        run: |
          set -e

          BUILD_TOOLS="$ANDROID_HOME/build-tools/34.0.0"

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            lovegame-android-release.apk

          echo ""
          echo "=============================================="
          echo " APK ASSINADO COM SUCESSO"
          echo "=============================================="
          echo ""

          ls -lh lovegame-android-release.apk

      # ---------------------------------------------------------
      # 19. Informações do APK
      # ---------------------------------------------------------
      - name: Show APK information
        run: |
          echo "Arquivo final:"
          realpath lovegame-android-release.apk

          echo ""
          echo "Tamanho:"
          du -h lovegame-android-release.apk

      # ---------------------------------------------------------
      # 20. Upload APK instalável
      # ---------------------------------------------------------
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: lovegame-android-release
          path: lovegame-android-release.apk
          if-no-files-found: error
          retention-days: 30
